name: Nagare issue report
description: Report a bug or suggest a change to Nagare.
body:
  - type: textarea
    id: issue
    attributes:
      label: What is the issue?
      description: |
        Say what you did, what you expected and what happened instead.
        For interface problems, attach a screenshot.
        For crashes, attach a crash log.
        If a specific torrent is involved, use public domain content only. Please don't share pirated torrents here.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Which version of Nagare?
      description: Find it in "About Nagare".
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Which version of macOS?
      description: Find it in "About This Mac".
    validations:
      required: true
